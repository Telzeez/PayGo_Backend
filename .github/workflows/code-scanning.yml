name: Open Source Code Scanning

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: code-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run Semgrep Community Edition
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Print actionable Semgrep findings
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          python - <<'PY'
          import json
          with open("semgrep.sarif", encoding="utf-8") as source:
              report = json.load(source)
          for run in report.get("runs", []):
              rules = {rule.get("id"): rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for finding in run.get("results", []):
                  location = finding.get("locations", [{}])[0].get("physicalLocation", {})
                  artifact = location.get("artifactLocation", {}).get("uri", "unknown")
                  line = location.get("region", {}).get("startLine", "?")
                  message = finding.get("message", {}).get("text", "").replace("\n", " ")
                  print(f"{finding.get('level', 'warning')} {finding.get('ruleId')} {artifact}:{line} {message}")
          PY

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d
        if: hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
