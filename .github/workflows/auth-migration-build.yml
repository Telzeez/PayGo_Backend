name: Auth migration build
on:
  push:
    branches: [feature/firebase-auth-migration, feature/customer-load-assessment]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible dependency security updates
        run: |
          npm uninstall crypto
          npm update
      - name: Enforce dependency security audit
        run: npm audit --audit-level=moderate
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Commit patched dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix: patch vulnerable npm dependencies"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
