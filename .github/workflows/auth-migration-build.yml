name: Auth migration build
on:
  push:
    branches: [feature/firebase-auth-migration, feature/customer-load-assessment]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report dependency security advisories
        run: |
          npm audit --json > /tmp/paygo-npm-audit.json || true
          node -e "const r = require('/tmp/paygo-npm-audit.json'); for (const [name, v] of Object.entries(r.vulnerabilities || {})) { console.log(name + ': ' + v.severity + ' | range=' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable)); for (const item of v.via || []) if (typeof item === 'object') console.log('  - ' + item.title + ' | ' + item.url); }"
      - run: npm run type-check
      - run: npm test
      - run: npm run build
